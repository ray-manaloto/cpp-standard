# The required checks (D93). `lint` runs the hk gate (D102) and `pins-validate`
# the pins check; `artifact-check`, `resolve` and `must-fail` are still stubs
# from setup step 3 that pass at once until M1a replaces them. Each job's
# name is its required-check name in .github/rulesets/main.json.
name: ci

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # The same checks as the pre-commit hook: `mise run check` runs every hk step
  # on every file, with the tools pinned in .mise/conf.d/lint.toml.
  lint:
    name: lint
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # mise.ci.toml: Python and uv on Linux for the pctools steps.
      MISE_ENV: ci
      # Each Python suite's record (python/suites/record.py, #186): the summary and artifact steps read them here.
      SUITE_TIMES_DIR: /tmp/suite-times
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785  # v5.2.8
        with:
          version: 2026.11.9
          install_args: --locked
      - name: Run the hk gate
        env:
          # pinact and the online zizmor audits call the GitHub API; a token
          # avoids the anonymous rate limit.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        # --ci: the ci profile turns off the repotools suite, which is Mac-only for now (D163).
        run: mise run check --online --ci
      # Neither step can fail the job (#186): the table goes in the job summary and the records in an artifact.
      - name: Summarize the test suites
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 -I python/suites/record.py summary >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the suite records
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: suite-times
          path: ${{ env.SUITE_TIMES_DIR }}
          if-no-files-found: warn
          retention-days: 30

  # M1a PR 1 (#127): the D51 content check of the pins and the golden vectors
  # for pin validation and artifact tags (D90). Standard-library Python on the
  # runner and git only, so no pinned tool is installed.
  pins-validate:
    name: pins-validate
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785  # v5.2.8
        with:
          version: 2026.11.9
          install: false
      - name: Validate the pins and run the golden vectors
        run: |
          python3 --version
          mise run pins:validate

  artifact-check:
    name: artifact-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "stub until M1a"

  resolve:
    name: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "stub until M1a"

  # The tracer bullet (#125): `mise run ci` on the gcc16-coverage preset. No
  # project image exists yet, so it runs in the digest-pinned Ubuntu container
  # of the M0 coverage spike, with GCC 16, CMake, Ninja and gcovr from apt.
  # M1a PR 2 replaces the container and the apt step with the tools image
  # that `resolve` picks; PR 4 adds the other presets.
  gate-linux-arm64:
    name: gate-linux-arm64
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: ubuntu:26.10@sha256:b5194b8e58989da0865ebc80078bf9f5f8742ec6a867c53f6ae699f6036756f7
    env:
      DEBIAN_FRONTEND: noninteractive
      # `mise run` would otherwise install every pinned tool (the hk lint
      # tools) first; the gate needs only the apt tools below.
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    steps:
      - name: Install GCC 16, CMake, Ninja and gcovr
        run: |
          apt-get update -q
          apt-get install -qy --no-install-recommends ca-certificates curl git g++-16 cmake ninja-build gcovr
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785  # v5.2.8
        with:
          version: 2026.11.9
          install: false
      - name: Run the gate
        run: mise run ci

  must-fail:
    name: must-fail
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "stub until M1a"
