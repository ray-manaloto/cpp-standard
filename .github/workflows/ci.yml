# The required checks (D93). `lint` runs the hk gate (D102), `pins-validate`
# the pins check, `artifact-check` and `resolve` pick the tools image (M1a PR 2)
# and wait for the p2996 toolchain (M1a PR 3), `gate-linux-arm64` runs the gate
# on three presets in the image, and `must-fail` runs the must-fail
# fixtures there (M1a PR 3, #130). Each job's name is its required-check name in
# .github/rulesets/main.json.
name: ci

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # The same checks as the pre-commit hook: `mise run check` runs every hk step
  # on every file, with the tools pinned in .mise/conf.d/lint.toml.
  lint:
    name: lint
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # mise.ci.toml: Python and uv on Linux for the pctools steps.
      MISE_ENV: ci
      # Each Python suite's record (python/suites/record.py, #186): the summary and artifact steps read them here.
      SUITE_TIMES_DIR: /tmp/suite-times
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785  # v5.2.8
        with:
          version: 2026.11.9
          install_args: --locked
      # repotools' tests install with UV_OFFLINE=1 (#184): fill uv's cache online first.
      - name: Warm uv's cache
        run: mise run uv:cache-warm
      - name: Run the hk gate
        env:
          # pinact and the online zizmor audits call the GitHub API; a token
          # avoids the anonymous rate limit.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run check --online --ci
      # Neither step can fail the job (#186): the table goes in the job summary and the records in an artifact.
      - name: Summarize the test suites
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 -I python/suites/record.py summary >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the suite records
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: suite-times
          path: ${{ env.SUITE_TIMES_DIR }}
          if-no-files-found: warn
          retention-days: 30

  # M1a PR 1 (#127): the D51 content check of the pins and the golden vectors
  # for pin validation and artifact tags (D90). Standard-library Python on the
  # runner and git only, so no pinned tool is installed.
  pins-validate:
    name: pins-validate
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785  # v5.2.8
        with:
          version: 2026.11.9
          install: false
      - name: Validate the pins and run the golden vectors
        run: |
          python3 --version
          mise run pins:validate

  # M1a PR 2 (#128): waits until the tools image this commit needs exists, as main's image or,
  # in a pull-request or merge-queue run, the builder run's own pr- image (D54, D61, D62, D134),
  # for at most 180 minutes (D61, D159). M1a PR 3 (#130): it waits the same way for the p2996
  # toolchain, as main's release or, in a pull-request or merge-queue run, the builder's cache
  # entry on this ref (D83, D91); it never builds. It also checks that publish.yml's inline names
  # and `artifact:names` agree (D114) and runs the unit tests of the wait, of resolve and of
  # toolchain:fetch's source table.
  artifact-check:
    name: artifact-check
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 190
    permissions:
      contents: read
      actions: read  # the builder run's artifacts and caches (section 6, D135)
    env:
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785  # v5.2.8
        with:
          version: 2026.11.9
          install: false
      - name: Publisher and artifact:names agree; the wait and resolve cases
        run: python3 -I tests/artifact/test_artifact.py
      - name: The source table of toolchain:fetch; the recipe's patch step
        run: |
          python3 -I tests/toolchain/test_fetch.py
          python3 -I tests/toolchain/test_build_patch.py
      - name: Wait for this commit's tools image and p2996 toolchain
        timeout-minutes: 181
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDER_RUN: the builder.yml run for ${{ github.sha }}
        run: mise run artifact:check --timeout 10800 --interval 60

  # M1a PR 2 (#128): picks the tools image the gate jobs run in. main's attested image is
  # verified (image:verify) and used by digest; else, in a pull-request or merge-queue run only,
  # the run's own unattested pr- image; on any other event it fails (D54, D98, D134). The
  # branch-signed refusal test runs in every run (spec #122 Testing Decisions).
  resolve:
    name: resolve
    needs: artifact-check
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read  # gh attestation verify
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      source: ${{ steps.resolve.outputs.source }}
    env:
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785  # v5.2.8
        with:
          version: 2026.11.9
          install: false
      - name: Log in to GHCR for gh attestation verify
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$ACTOR" --password-stdin <<<"$GH_TOKEN"
      - name: An image attested from a branch is refused
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/image_verify/run.sh
      - id: resolve
        name: Resolve the tools image
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run image:resolve --arch arm64

  # The gate (#125, M1a PR 2): `mise run ci` in the tools image, by the digest `resolve`
  # picked: toolchain:fetch installs p2996 (#130) and bootstrap installs vcpkg at its baseline, then
  # the gate builds and covers the core module on three presets (#132). The job never builds a toolchain: in a
  # pull-request or merge-queue run it takes main's release, else the copy the builder staged in
  # this ref's cache (artifact-check waited for one of them); in a run dispatched on main it
  # takes only main's release (release-only mode).
  gate-linux-arm64:
    name: gate-linux-arm64
    needs: [artifact-check, resolve]
    if: ${{ needs.artifact-check.result == 'success' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      attestations: read  # gh attestation verify of the toolchain release
    container:
      # resolve outputs <image>@sha256:<digest> only (python/artifact/artifact.py resolve).
      image: ${{ needs.resolve.outputs.image }}  # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    env:
      # The tools image holds the tools of .mise/conf.d/tools.toml; the hk lint tools are not
      # in it and the gate does not need them.
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    steps:
      - name: The image resolve verified
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          SOURCE: ${{ needs.resolve.outputs.source }}
        run: |
          echo "Running in $IMAGE ($SOURCE: main is attested and verified, pr is this run's own)"
          id
          mise --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the checkout's mise config
        run: mise trust "$GITHUB_WORKSPACE"
      - id: tag
        name: The p2996 tag
        run: echo "p2996=$(mise run -q artifact:tag p2996-linux-arm64)" >> "$GITHUB_OUTPUT"
      # The staged copy (D91): the exact path and key builder.yml saved on this ref.
      - if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/toolchains/${{ steps.tag.outputs.p2996 }}
          key: toolchain-${{ steps.tag.outputs.p2996 }}
      - id: fetch
        name: Fetch the p2996 toolchain
        env:
          GH_TOKEN: ${{ github.token }}
          # fetch.py allows the staged copy only on a hosted runner. RUNNER_* names are the
          # runner's own and a workflow cannot set them (GitHub's default-variables docs), and a
          # job container may not see the runner's, so the value comes under our own name.
          CPPSTD_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          # A run dispatched on main takes only main's release (the second acceptance step of
          # #130 and the next ticket); every other run may take the staged copy but never builds.
          MODE: >-
            ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
            && '--release-only' || '--no-rebuild' }}
        run: mise run toolchain:fetch "$MODE"
      - name: Bootstrap vcpkg at the pinned baseline
        run: mise run vcpkg:bootstrap
      - name: Run the gate
        env:
          # The p2996 preset builds with this toolchain (cmake/toolchains/p2996.cmake).
          CPPSTD_P2996_PREFIX: ${{ steps.fetch.outputs.prefix }}
        run: mise run ci

  # M1a PR 3 (#130): `mise run ci-must-fail` in the tools image, the same command as outside
  # Actions. Its runner's own test runs first: a fixture that goes green fails the job.
  must-fail:
    name: must-fail
    needs: [artifact-check, resolve]
    if: ${{ needs.artifact-check.result == 'success' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
      attestations: read  # gh attestation verify in the toolchain fixtures
    container:
      # resolve outputs <image>@sha256:<digest> only (python/artifact/artifact.py resolve).
      image: ${{ needs.resolve.outputs.image }}  # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    env:
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the checkout's mise config
        run: mise trust "$GITHUB_WORKSPACE"
      - id: tag
        name: The p2996 tag
        run: echo "p2996=$(mise run -q artifact:tag p2996-linux-arm64)" >> "$GITHUB_OUTPUT"
      # The p2996 uncovered-line fixture needs the toolchain: the same fetch as the gate's.
      - if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/toolchains/${{ steps.tag.outputs.p2996 }}
          key: toolchain-${{ steps.tag.outputs.p2996 }}
      - id: fetch
        name: Fetch the p2996 toolchain
        env:
          GH_TOKEN: ${{ github.token }}
          CPPSTD_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MODE: >-
            ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
            && '--release-only' || '--no-rebuild' }}
        run: mise run toolchain:fetch "$MODE"
      - name: A fixture that goes green fails the run
        run: python3 -I tests/must_fail/test_ci_must_fail.py
      - name: Run the must-fail fixtures
        env:
          CPPSTD_P2996_PREFIX: ${{ steps.fetch.outputs.prefix }}
          GH_TOKEN: ${{ github.token }}
        run: mise run ci-must-fail
