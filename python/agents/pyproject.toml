# Coverage settings only: these are standard-library scripts run as `python -I <file>`, not a package. `mise run
# agents:cov` runs the check scripts under coverage and fails below the floor (#185). No [tool.ruff]: ruff keeps the
# repository's settings.

[tool.coverage.run]
branch = true
parallel = true
# The check scripts start slot.py, testtab.py, testguard.py and supervise.py as child processes.
patch = ["subprocess"]
source = ["python/agents"]
# The checks themselves are not the code under test. app_create.py is measured and stays at 0%: it is the owner's
# interactive GitHub App flow, which no check runs.
omit = ["python/agents/*_check.py"]
# The check scripts' own processes measure nothing (they are omitted), only their children do.
disable_warnings = ["no-data-collected"]

[tool.coverage.report]
# Discovery during reporting also finds check scripts that were omitted during collection.
omit = ["python/agents/*_check.py"]
# The floor is the coverage measured when it was set (#185). Raise it when coverage rises; a change that lowers it
# says why in its commit message and pull request.
fail_under = 65.4
precision = 1
show_missing = true
