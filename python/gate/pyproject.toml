# Coverage settings only: checklist.py is a standard-library script that post-merge.yml's
# checklist job runs on a bare python3. `mise run gate:cov` runs its unit tests under coverage
# and fails below the floor (#185). No [tool.ruff]: ruff keeps the repository's settings.

[tool.coverage.run]
branch = true
parallel = true
source = ["python/gate"]

[tool.coverage.report]
# The floor is the coverage measured when it was set (#185). Raise it when coverage rises; a change that lowers it
# says why in its commit message and pull request. The unit tests exercise main(), and gate:cov also measures
# the script entry point.
fail_under = 100.0
precision = 1
show_missing = true
