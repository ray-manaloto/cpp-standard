# Coverage settings only: fetch.py is a standard-library script that toolchain:fetch runs on a bare python3 (the
# gate container, the owner's machines). `mise run toolchain:cov` runs its unit tests under coverage and fails below
# the floor (#185). No [tool.ruff]: ruff keeps the repository's settings.

[tool.coverage.run]
branch = true
parallel = true
source = ["python/toolchain"]

[tool.coverage.report]
# The floor is the coverage measured when it was set (#185). Raise it when coverage rises; a change that lowers it
# says why in its commit message and pull request. The tests replace GitHub Releases, `gh attestation verify` and the
# rebuild with fakes, so only mise_rebuild and the CLI glue stay unmeasured.
fail_under = 93.4
precision = 1
show_missing = true
