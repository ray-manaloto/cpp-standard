# Coverage settings only: artifact.py is a standard-library script that CI's artifact-check and resolve jobs run on a
# bare python3. `mise run artifact:cov` runs its unit tests under coverage and fails below the floor (#185).
# No [tool.ruff]: ruff keeps the repository's settings.

[tool.coverage.run]
branch = true
parallel = true
source = ["python/artifact"]

[tool.coverage.report]
# The floor is the coverage measured when it was set (#185). Raise it when coverage rises; a change that lowers it
# says why in its commit message and pull request. The tests replace GHCR and `gh attestation verify` with fakes, so
# the live Registry, gh_verify and the CLI stay unmeasured.
fail_under = 44.1
precision = 1
show_missing = true
