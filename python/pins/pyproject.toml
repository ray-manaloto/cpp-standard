# Coverage settings only: pins.py is a standard-library script that CI's pins-validate job runs on a bare python3.
# `mise run pins:cov` runs the same three parts as pins:validate under coverage and fails below the floor (#185).
# No [tool.ruff]: ruff keeps the repository's settings.

[tool.coverage.run]
branch = true
parallel = true
source = ["python/pins"]

[tool.coverage.report]
# The floor is the coverage measured when it was set (#185). Raise it when coverage rises; a change that lowers it
# says why in its commit message and pull request.
fail_under = 90.1
precision = 1
show_missing = true
