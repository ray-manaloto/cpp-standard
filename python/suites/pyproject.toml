# Coverage settings only: record.py is a standard-library script run as `python3 -I record.py`, not a package.
# `mise run suites:cov` runs record_check.py under coverage and fails below the floor (#185, #186). No [tool.ruff]:
# ruff keeps the repository's settings.

[tool.coverage.run]
branch = true
parallel = true
# record_check.py starts record.py as a child process.
patch = ["subprocess"]
source = ["python/suites"]
omit = ["python/suites/*_check.py"]
# The check script's own process measures nothing (it is omitted), only its children do.
disable_warnings = ["no-data-collected"]

[tool.coverage.report]
# The floor is the coverage measured when it was set (#185). Raise it when coverage rises; a change that lowers it
# says why in its commit message and pull request.
fail_under = 96.1
precision = 1
show_missing = true
