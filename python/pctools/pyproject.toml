[project]
name = "pctools"
version = "0.1.0"
description = "The PC's setup checks: pc:doctor reads the PC over ssh and changes nothing"
# The repository's Python pin (.mise/conf.d/build.toml, mise.ci.toml).
requires-python = ">=3.14"
dependencies = ["pydantic", "pyyaml"]

[project.scripts]
pctools = "pctools.cli:main"

[dependency-groups]
# datamodel-code-generator is locked here, so pctools:codegen and its --check use one version everywhere.
dev = ["datamodel-code-generator[ruff]", "pytest", "pytest-cov"]

[build-system]
requires = ["uv_build>=0.13.6"]
build-backend = "uv_build"

[tool.datamodel-codegen]
input = "schema/pctools.schema.json"
input-file-type = "jsonschema"
output = "src/pctools/models.py"
output-model-type = "pydantic_v2.BaseModel"
enable-faux-immutability = true
target-python-version = "3.14"
use-annotated = true
use-type-alias = true
strict-nullable = true
use-standard-collections = true
use-union-operator = true
use-schema-description = true
use-field-description = true
disable-timestamp = true
formatters = ["ruff-format"]
custom-file-header = "# Generated by datamodel-codegen from schema/pctools.schema.json; edit the schema, then mise run pctools:codegen."

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=pctools --cov-branch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
# D: one-line module docstrings only. CPY001: no copyright headers. TC001-TC003: annotations are lazy (Python 3.14+),
# so a TYPE_CHECKING block buys nothing. S603/S607: the doctor runs ssh. COM812: conflicts with ruff format.
ignore = ["D", "CPY001", "TC001", "TC002", "TC003", "COM812", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest checks with assert. PLR2004: tests compare against literal exit codes.
"tests/**" = ["S101", "PLR2004"]
# Generated: datamodel-codegen orders its imports its own way; every other rule applies. N815: the CDI spec's own
# keys (hostPath, containerEdits) stay its field names. S105: the Result enum's pass_ = "pass" is a check result.
"src/pctools/models.py" = ["I001", "S105", "N815"]

[tool.ty.environment]
python = ".venv"

[tool.uv]
# The same fixed cutoff as mise's minimum_release_age (mise.toml), so `uv lock` resolves the same set whenever it
# runs. Move it with that setting.
exclude-newer = "2026-11-13T00:00:00Z"
