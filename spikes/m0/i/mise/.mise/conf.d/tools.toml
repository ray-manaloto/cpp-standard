# M0 (i) spike: a Python tool, to check that the lock regenerates the same
# on the Mac host and in the container (jdx/mise#15657, D99).
[tools]
python = "3.15.2"
# mise lock needs uv to write the PyPI sidecars under .mise/locks/**; without
# it the sidecar and the uv line in mise.lock are skipped (M0 (i) finding).
uv = "0.13.8"
"pipx:clang-format" = "23.1.5"
