# CI's tools beyond mise.toml's (MISE_ENV=ci, set by ci.yml's lint job): Python and uv for the pctools gate on Linux.
# This environment's pins override .mise/conf.d/tools.toml's Python and uv (D74), which the Mac, the tools image and
# `mise -E ubuntu bootstrap` install. The second Python and datamodel-codegen are CI's alone.
[tools]
# 3.15.2 beside it for workflowtools (python/workflow: requires-python >=3.15), whose //workflow:check also needs
# datamodel-codegen; the Mac takes both from the owner's global config. repotools' //repo:check runs here too (#181).
python = [
  { version = "3.14.8", os = [
    "linux",
  ] },
  { version = "3.15.2", os = [
    "linux",
  ] },
]
"pipx:datamodel-code-generator" = { version = "0.89.0", os = ["linux"] }
# After changing uv's pin, run `mise run uv:cache-warm`: a new uv can rename its cache buckets (#184).
uv = { version = "0.13.9", os = ["linux"] }
# //repo:lint's rule tests and scan; the Mac takes it from the owner's global config.
"github:ast-grep/ast-grep" = { version = "0.51.3", os = ["linux"] }
# repotools' shell:apply tests start a login zsh; the hosted runner has none (#181). conda-forge's build, as for doxygen.
"conda:zsh" = { version = "5.9.2", os = ["linux"] }
