# Golden vectors for `mise run artifact:tag` (D90, environment-standard.md section 2).
# [tree] is committed to a fresh git repository, and `artifact` (with `arch`, default arm64) is
# tagged at that commit. A vector with `change` or `remove` changes exactly one input of the
# hash-input table; its tag must differ from the baseline vector of the same artifact and arch
# (or, with `same = true`, equal it). `against` names another vector to compare with instead.
# The expected tags were computed outside pins.py with git hash-object, jq and shasum
# (tests/artifact_tag/expected.sh). A vector may omit `tag` and assert only its relative
# behaviour (`same`/`against`), for a rule change whose absolute hashes were not recomputed;
# expected.sh still prints its tag, to paste in. `inputs`, where given, lists the files
# `pins.py tag --inputs` puts in an image's build context: every hashed file, the whole lock
# for a slice.

[tree]
"image/base.Dockerfile" = '''
ARG UBUNTU
FROM ubuntu@${UBUNTU}
'''
"image/base.inputs.toml" = '''
image = "ubuntu:26.10@sha256:b5194b8e58989da0865ebc80078bf9f5f8742ec6a867c53f6ae699f6036756f7"
mise = "2026.11.9"
mise_signer = "ps1_0123abcd"
packslip_image = "ghcr.io/jdx/packslip@sha256:2222222222222222222222222222222222222222222222222222222222222222"
'''
