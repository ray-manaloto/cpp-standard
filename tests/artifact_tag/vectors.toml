# Golden vectors for `mise run artifact:tag` (D90, environment-standard.md section 2).
# [tree] is committed to a fresh git repository, and `artifact` (with `arch`, default arm64) is
# tagged at that commit. A vector with `change` or `remove` changes exactly one input of the
# hash-input table; its tag must differ from the baseline vector of the same artifact and arch
# (or, with `same = true`, equal it). `against` names another vector to compare with instead.
# The expected tags were computed outside pins.py with git hash-object, jq and shasum
# (tests/artifact_tag/expected.sh).

[tree]
"image/base.Dockerfile" = '''
ARG UBUNTU
FROM ubuntu@${UBUNTU}
'''
"image/base.inputs.toml" = '''
image = "ubuntu:26.10@sha256:b5194b8e58989da0865ebc80078bf9f5f8742ec6a867c53f6ae699f6036756f7"
mise = "2026.11.9"
mise_signer = "ps1_0123abcd"
packslip_image = "ghcr.io/jdx/packslip@sha256:2222222222222222222222222222222222222222222222222222222222222222"
'''
".mise/conf.d/apt.toml" = '''
[bootstrap.packages]
"apt:clang-23" = { version = "1:23.1.6-1", os = ["linux"] }
'''
".mise/conf.d/apt-toolchain-host.toml" = '''
[bootstrap.packages]
"apt:g++-16" = { version = "16.2.0-3ubuntu1", os = ["linux"] }
'''
".mise/conf.d/apt-sources.toml" = '''
[bootstrap.apt.sources.llvm]
uris = "https://apt.llvm.org/resolute/"
suites = "llvm-toolchain-resolute-23"
components = "main"
key = "https://apt.llvm.org/llvm-snapshot.gpg.key"
fingerprint = "6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
'''
".mise/tasks/artifact/build" = '''
#!/usr/bin/env bash
echo build
'''
"image/tools.Dockerfile" = '''
ARG BASE
FROM base@${BASE}
'''
".mise/conf.d/tools.toml" = '''
[tools]
cmake = "4.5.0"
"pypi:gcovr" = "8.8"
'''
".mise/mise.lock" = '''
lockfile_version = 4

[[tools.cmake]]
version = "4.5.0"
backend = "aqua:Kitware/CMake"

[tools.cmake."platforms.linux-arm64"]
checksum = "sha256:1111111111111111111111111111111111111111111111111111111111111111"
url = "https://github.com/Kitware/CMake/releases/download/v4.5.0/cmake-4.5.0-linux-aarch64.tar.gz"

[tools.cmake."platforms.linux-x64"]
checksum = "sha256:4444444444444444444444444444444444444444444444444444444444444444"
url = "https://github.com/Kitware/CMake/releases/download/v4.5.0/cmake-4.5.0-linux-x86_64.tar.gz"

[tools.cmake."platforms.macos-arm64"]
checksum = "sha256:5555555555555555555555555555555555555555555555555555555555555555"
url = "https://github.com/Kitware/CMake/releases/download/v4.5.0/cmake-4.5.0-macos-universal.tar.gz"

[[tools."pypi:gcovr"]]
version = "8.8"
backend = "pypi:gcovr"
uv = { path = "locks/pypi-gcovr/8.8~abc", digest = "sha256:6666666666666666666666666666666666666666666666666666666666666666" }
'''
".mise/locks/pypi-gcovr/8.8~abc/uv.lock" = '''
version = 1
'''
".mise/locks/pypi-gcovr/8.8~abc/pyproject.toml" = '''
[project]
name = "gcovr-sidecar"
'''
"toolchains/p2996/pins.toml" = '''
upstream = "21.0.0-p2996"
salt = 0
host_tools = ["cmake"]
apt_compiler = false
source = { url = "https://github.com/bloomberg/clang-p2996/archive/562409c7942690d59ea470762515f88f24b16e23.tar.gz", sha256 = "3333333333333333333333333333333333333333333333333333333333333333", commit = "562409c7942690d59ea470762515f88f24b16e23" }
'''
"toolchains/p2996/build.sh" = '''
#!/usr/bin/env bash
cmake -G Ninja ../llvm
'''
