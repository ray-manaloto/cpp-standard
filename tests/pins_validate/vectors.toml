# Golden vectors for `mise run pins:validate` (D51, D72, environment-standard.md section 3).
# [tree] is a valid tree; each vector applies `change` (files replaced or added) and `remove`
# to it, and `reject` names the one rule that must fail. A vector without `reject` must pass.
# The rules come from the design, not from the implementation.

[tree]
"pins-allowlist.toml" = '''
hosts = ["github.com", "apt.llvm.org", "ftp.gnu.org"]
tools = ["cmake", "hk"]
apt = ["g++-16", "clang-23"]
other_fragments = []
[apt_sources.llvm]
uris = "https://apt.llvm.org/resolute/"
suites = "llvm-toolchain-resolute-23"
components = "main"
key = "https://apt.llvm.org/llvm-snapshot.gpg.key"
fingerprint = "6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
'''
"mise.toml" = '''
min_version = "2026.11.9"
[settings]
lockfile = true
'''
".mise/conf.d/tools.toml" = '''
[tools]
cmake = "4.5.0"
'''
".mise/conf.d/lint.toml" = '''
[tools]
hk = "2.13.0"
'''
".mise/conf.d/apt-toolchain-host.toml" = '''
[bootstrap.packages]
"apt:g++-16" = { version = "16.2.0-3ubuntu1", os = ["linux"] }
'''
".mise/conf.d/apt.toml" = '''
[bootstrap.packages]
"apt:clang-23" = { version = "1:23.1.6~++20261116+1-1~exp1~20261116000000.1", os = ["linux"] }
'''
".mise/conf.d/apt-sources.toml" = '''
[bootstrap.apt.sources.llvm]
uris = "https://apt.llvm.org/resolute/"
suites = "llvm-toolchain-resolute-23"
components = "main"
key = "https://apt.llvm.org/llvm-snapshot.gpg.key"
fingerprint = "6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
'''
".mise/mise.lock" = '''
lockfile_version = 4

[[tools.cmake]]
version = "4.5.0"
backend = "aqua:Kitware/CMake"

[tools.cmake."platforms.linux-arm64"]
checksum = "sha256:1111111111111111111111111111111111111111111111111111111111111111"
url = "https://github.com/Kitware/CMake/releases/download/v4.5.0/cmake-4.5.0-linux-aarch64.tar.gz"

[[tools.hk]]
version = "2.13.0"
backend = "aqua:jdx/hk"
'''
"image/base.inputs.toml" = '''
image = "ubuntu:26.10@sha256:b5194b8e58989da0865ebc80078bf9f5f8742ec6a867c53f6ae699f6036756f7"
mise = "2026.11.9"
mise_signer = "ps1_0123abcd"
packslip_image = "ghcr.io/jdx/packslip@sha256:2222222222222222222222222222222222222222222222222222222222222222"
'''
"toolchains/p2996/pins.toml" = '''
upstream = "21.0.0-p2996"
salt = 0
apt_compiler = false
host_tools = ["cmake"]
source = { url = "https://github.com/bloomberg/clang-p2996/archive/562409c7942690d59ea470762515f88f24b16e23.tar.gz", sha256 = "3333333333333333333333333333333333333333333333333333333333333333", commit = "562409c7942690d59ea470762515f88f24b16e23" }
'''

[[vector]]
name = "the valid tree passes"

# D51: a pin fragment holds only [tools] or [bootstrap.packages].
[[vector]]
name = "tools.toml with an [env] section"
reject = "section"

[vector.change]
".mise/conf.d/tools.toml" = '''
[tools]
cmake = "4.5.0"
[env]
CC = "gcc-16"
'''

[[vector]]
name = "apt.toml with a [tasks] section"
reject = "section"

[vector.change]
".mise/conf.d/apt.toml" = '''
[bootstrap.packages]
"apt:clang-23" = "1:23.1.6-1"
[tasks.x]
run = "true"
'''

[[vector]]
name = "apt.toml with a bootstrap.files table"
reject = "section"

[vector.change]
".mise/conf.d/apt.toml" = '''
