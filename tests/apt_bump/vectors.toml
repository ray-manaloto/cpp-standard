# Offline vectors for `mise run pins:apt-bump` (D165, #193), run by `mise run pins:validate`.
# [tree] holds small pin files; [index] holds Packages stanzas per "<source>/<suite>/<component>/<arch>", from which
# the runner builds each source's dists/ tree with a release file that lists the right checksums (SHA512 for
# ubuntu, inside a clearsigned InRelease; SHA256 for llvm). A vector runs `cmd` (bump or check) on a copy of the
# tree with its `change`d files and `index` entries, and may set `corrupt` (flip one byte of that index after its
# checksum is listed) or `algo` (the llvm release file's only checksum). `exit`, `stdout` (exact lines), `stderr`
# (substrings), `unchanged` and `contains` are what must hold. [[order]] vectors check dpkg's version order.
# The must-fail fixtures are "check-gone-version" (#193: a pinned version not in the index fails the daily check
# and names the package) and "checksum-mismatch" (#193: an index that does not match its checksum is refused).

