# The Ubuntu 26.10 packages that shape a compiler (D75): a toolchain hash input, and the base
# image's. Each package is pinned to its newest version, and a daily job moves the pin
# (D12, D27, D152).
[bootstrap.packages]
"apt:g++-16" = { version = "16.2.0-3ubuntu1", os = ["linux"] }
"apt:binutils" = { version = "2.47-6ubuntu1", os = ["linux"] }
"apt:make" = { version = "4.4.1-3", os = ["linux"] }
"apt:libc6-dev" = { version = "2.44-1ubuntu2.1", os = ["linux"] }
