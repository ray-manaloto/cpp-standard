# clang-p2996 with its own libc++ and compiler-rt (environment-standard.md section 2, D30, D32, D85).
# Shared by every OS; the macOS recipe arrives with M3. Every flag lives in build.sh.
upstream = "21.0.0-p2996"
salt = 0
# build.sh bootstraps with apt.llvm.org's clang-23 and lld-23 (apt.toml), so apt.toml is an input
# (D162) - only the pins named below, not the whole file (#254): the bootstrap compiler
# (CMAKE_C(XX)_COMPILER=/usr/lib/llvm-23/bin/clang++) and the linker (LLVM_USE_LINKER=lld).
apt_compiler = true
apt_packages = ["apt:clang-23", "apt:lld-23"]
# Locked mise tools the build runs: their linux-<arch> slice of .mise/mise.lock is hashed.
host_tools = ["cmake", "ninja"]

