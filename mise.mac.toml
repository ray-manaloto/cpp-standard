# The Mac's own config: loaded only where the `mac` config environment is selected (mise -E mac, or env = ["mac"]
# in an untracked miserc.local.toml). The PC and CI never select it, so their plans have none of this.
#
# A copy of dotfiles' root mise.toml from its [bootstrap.secrets] table to its end, unchanged (dotfiles main
# 094d435b), by M1 of docs/designs/level-1/machine-bootstrap-migration.md (D150); dotfiles still applies on the Mac
# until the switch. The sources under unix/home/ and python/guards/src/guards/ are dotfiles' files at that commit,
# byte for byte, at the same relative paths, so every `source` below is dotfiles' own string. Every comment below
# is dotfiles': issue numbers are dotfiles issues, "this repo" and "the main checkout" are dotfiles, and the tasks
# the comments name (shell:apply, skills:doctor, herdr:doctor) are not here yet. The hand-over notes for the switch
# are in the design's M1 section.
#
# Added in cpp-standard, each marked: the git_user_* lines in [bootstrap.secrets], the section at the end, its
# sources (unix/home/.tmux.conf, unix/home/.gnupg/common.conf, unix/home/.gitconfig.identity.tera) and the two
# GIT_USER_* lines in unix/home/.config/fnox/config.toml.
#
# Newer than 094d435b: unix/home/.config/agents/workflow/ and the ticket-retro and session-retro skills are
# dotfiles' files at ffb02a6e, the frozen source commit of the tools move (D160, #155). The agent links from
# "The paths the shared file" to the session-retro entries are dotfiles' after the tools switch (#156), byte for
# byte: the moved files resolve into this repository's main checkout by a home-relative source, and the skills
# folder is one link per entry.

# Names that must not be public (machine names, addresses) live in Doppler, never in this repo
# (docs/research/private-names.md). The global fnox file reads each one with env = "exec", so
# `fnox exec -- mise dot apply ...` puts it in the environment for the templates that call secret().
[bootstrap.secrets]
pc_host = "PC_HOST"
pc_lan_host = "PC_LAN_HOST"
cloudflare_account_id = "CF_ACCOUNT_ID"
# Added in cpp-standard (D150, M1): the git identity the ~/.gitconfig/identity entry renders.
git_user_name = "GIT_USER_NAME"
git_user_email = "GIT_USER_EMAIL"

# The ~/.gemini/config/skills entry's source is ~/.agents/skills, outside the repo, and one missing source stops
# the whole apply (mise 2026.11.6 crates/mise-system/src/files.rs:5722-5806). This hook runs before every
# `mise dot apply` and bootstrap's dotfiles step (src/cli/dotfiles/apply.rs:27), so a new Mac has the folder.
[bootstrap.hooks.pre-dotfiles]
run = "mkdir -p ~/.agents/skills"

[dotfiles]
"~/.config/mise/config.toml" = { source = "unix/home/.config/mise/config.toml", mode = "symlink" }
"~/.config/mise/miserc.toml" = { source = "unix/home/.config/mise/miserc.toml", mode = "symlink" }
"~/.config/mise/locks" = { source = "unix/home/.config/mise/locks", mode = "symlink" }
"~/.config/mise/apple-bin" = { source = "unix/home/.config/mise/apple-bin", mode = "symlink" }
"~/.config/mise/mise.lock" = { source = "unix/home/.config/mise/mise.lock", mode = "symlink" }
"~/.config/mise/tasks" = { source = "unix/home/.config/mise/tasks", mode = "symlink" }
"~/.config/fnox/config.toml" = { source = "unix/home/.config/fnox/config.toml", mode = "symlink" }
"~/.config/starship.toml" = { source = "unix/home/.config/starship.toml", mode = "symlink" }
# The OpenCode service binds loopback only (tailnet-only ruling, 2026-11-11): service.json also holds the
# service password, so this owns only its hostname key and leaves the rest to opencode. Unset, opencode 2.2.7
# binds 127.0.0.1 (packages/cli/src/server-process.ts:72); a 0.0.0.0 left by `opencode service set hostname`
# opened it to the LAN. No routine task applies this entry (shell:apply names its own targets): on each Mac run
# mise dot apply "~/.config/opencode/service.json/bind" from the main checkout, then
# `opencode service set hostname 127.0.0.1`, which stops the running service (service-config.ts:273-276) so its
# supervisor starts it again on loopback. The target assumes neither OPENCODE_CONFIG_DIR nor XDG_CONFIG_HOME
# moves opencode's config folder.
"~/.config/opencode/service.json/bind" = { source = "unix/home/.config/opencode/service.bind.json", merge = true, permissions = "0600" }
# OpenCode's context7 and exa servers send the key as a Bearer header from its own {env:VAR} syntax
# (packages/core/src/config/variable.ts:25-28 at v2.2.7), so `fnox proxy run` can swap the placeholder for the real
# key. This owns only those headers; the old literal "${CONTEXT7_API_KEY}" header is not removed by a merge.
"~/.config/opencode/opencode.json/mcp-keys" = { source = "unix/home/.config/opencode/mcp-keys.json", merge = true }
# Claude's apify MCP server gets its key from `fnox get` at each connect (headersHelper,
# https://code.claude.com/docs/en/mcp; 10 s limit), with an explicit PATH as 1natsu172/dotfiles
# bin/claude-utils/mcp-auth-header.sh:22,35 and fapont/dotfiles modules/agents/claude/mcp.json:6 do. A missing key
# (if_missing = "warn" makes `fnox get` print nothing and exit 0) or a failed get exits non-zero instead of sending an
# empty header. Claude Code rewrites ~/.claude.json while it runs, so write this entry with Claude's own CLI
# (`claude mcp add-json apify '<this JSON>' -s user`) rather than a whole-root apply.
"~/.claude.json/mcp-apify" = { source = "unix/home/.claude.mcp-apify.json", merge = true, permissions = "0600" }
# jdx MCP servers (owner, 2026-11-13) for Claude and Codex: mise (tools, tasks, env, config; run_task needs a
# trusted project), hk (plan, checks, safe fixes), pitchfork --local (this project's daemons only), and usage
# serving mise's own CLI spec (list_commands, describe_command) from ~/.cache/mise/usage-mise.kdl, written at each start
# (stdin is the MCP transport, and Linux caps one argument at 128 KiB, so not inline).
# No fnox server: its exec tool would bypass the guard on `fnox exec`; agents use `fnox proxy run` for keys.
# Each launches through ~/.local/bin/mise, as risu729/dotfiles unix/claude/mcp.json and unix/codex/mcp.toml do.
# Claude's entry is written as apify's is (`claude mcp add-json <name> '<its JSON>' -s user`).
"~/.claude.json/mcp-jdx" = { source = "unix/home/.claude.mcp-jdx.json", merge = true, permissions = "0600" }
"~/.codex/config.toml/mcp-jdx" = { source = "unix/home/.codex/mcp-jdx.toml", merge = true, permissions = "0600" }
# The apify plugin stays enabled for its skills and agent, but its own MCP server (plugin:apify:apify, OAuth) is
# denied: the user-scope `apify` server above is the one with the key. deniedMcpServers merges from every settings
# source, so a user can deny servers for themselves (Claude Code 2.1.322 settings schema, allowManagedMcpServersOnly).
"~/.claude/settings.json/mcp-deny" = { source = "unix/home/.claude/settings.mcp-deny.json", merge = true }
# Keep the Artifact tools (owner, 2026-11-17). jouet 0.0.5's `jouet setup claude` denies Artifact, ArtifactComments
# and ArtifactData unless permissions.allow or permissions.ask already names them (jouet v0.0.5 docs/setup.md "the
# Artifact tools are denied", src/setup.rs:60). mise's merge replaces a whole array (mise v2026.11.9
# docs/dotfiles/edits.md:121-122), so this entry owns the whole allow list: an "always allow" added later shows up
# as drift in skills:doctor, to be copied here or dropped. A permission entry: the owner applies it.
"~/.claude/settings.json/allow" = { source = "unix/home/.claude/settings.allow.json", merge = true }
# No grayed-out prompt suggestions in the input box: a suggestion looks like a typed draft, so an agent sending to a
# tab can't tell it from the owner's text (owner ruling 2026-11-11). Claude Code 2.1.322 reads promptSuggestionEnabled
# from settings unless CLAUDE_CODE_ENABLE_PROMPT_SUGGESTION is set (https://code.claude.com/docs/en/settings-reference).
"~/.claude/settings.json/prompt-suggestions" = { source = "unix/home/.claude/settings.prompt-suggestions.json", merge = true }
# Leads merge their own PRs once hk check --all passes (owner rulings 2026-11-15 and 2026-11-17: no review is
# required). The auto-mode soft-deny "Merge Without Review" wants a human approval, so the classifier blocked those
# merges. Auto mode reads prose
# exceptions from autoMode.allow in user settings only (https://code.claude.com/docs/en/auto-mode-config.md);
# "$defaults" keeps the shipped list. Undo: remove this entry, then `claude auto-mode reset`.
"~/.claude/settings.json/automode" = { source = "unix/home/.claude/settings.automode.json", merge = true }
# ssh: the PC over the tailnet. The line goes first in ~/.ssh/config, so the folder's hosts win over older
# entries below it; the rest of ~/.ssh/config stays the owner's. tailnet.conf is a template: the PC's private
# name and its break-glass LAN address (`ssh pc-lan`) come from Doppler (PC_HOST and PC_LAN_HOST, see
# [bootstrap.secrets]), so apply it with the real values in the
# environment: fnox exec -- mise dot apply "~/.ssh/config/include" "~/.ssh/config.d/tailnet.conf".
# Check: ssh -G pc | grep -i "^hostname" prints the PC's name.
"~/.ssh/config/include" = { line = "Include ~/.ssh/config.d/*", position = "prepend" }
"~/.ssh/config.d/tailnet.conf" = { source = "unix/home/.ssh/config.d/tailnet.conf.tera", mode = "template" }
# OpenCode's Workers AI base URL has the account ID in its path, which the fnox proxy can't add, so the ID is a
