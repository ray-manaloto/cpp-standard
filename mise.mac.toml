# environment: fnox exec -- mise dot apply "~/.config/mise/conf.d/cloudflare.toml".
"~/.config/mise/conf.d/cloudflare.toml" = { source = "unix/home/.config/mise/conf.d/cloudflare.toml.tera", mode = "template", permissions = "0600" }
