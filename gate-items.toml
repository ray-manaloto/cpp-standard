[items.must-fail-toolchain-unattested]
what = "toolchain:fetch refuses an unattested release"
environment = "linux"
job = "must-fail"
fixture = "toolchain-unattested"
check = "toolchain:fetch"

[items.must-fail-uncovered-line-gcc16]
what = "ci:coverage refuses one uncovered line, measured with gcc16's gcov"
environment = "linux"
job = "must-fail"
fixture = "uncovered-line-gcc16"
check = "ci:coverage"

[items.must-fail-uncovered-line-clang23]
what = "ci:coverage refuses one uncovered line, measured with clang23's llvm-cov gcov"
environment = "linux"
job = "must-fail"
fixture = "uncovered-line-clang23"
check = "ci:coverage"

[items.must-fail-uncovered-line-p2996]
what = "ci:coverage refuses one uncovered line, measured with the p2996 toolchain's llvm-cov gcov"
environment = "linux"
job = "must-fail"
fixture = "uncovered-line-p2996"
check = "ci:coverage"

[items.must-fail-vcpkg-baseline]
what = "vcpkg:bootstrap refuses a checkout at another commit than the pinned baseline"
environment = "linux"
job = "must-fail"
fixture = "vcpkg-baseline"
check = "vcpkg:bootstrap"

[items.must-fail-toolchain-wrong-hash]
what = "toolchain:fetch refuses an attested archive whose inputs-hash.txt differs from its tag's hash"
environment = "linux"
job = "must-fail"
fixture = "toolchain-wrong-hash"
check = "toolchain:fetch"
