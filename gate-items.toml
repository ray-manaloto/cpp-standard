[items.tests-clang23-coverage]
what = "clang23-coverage's ctest passes"
environment = "linux"
job = "gate-linux-arm64"
preset = "clang23-coverage"
check = "ci"

[items.coverage-clang23-coverage]
what = "clang23-coverage measures 100% line coverage of src/"
environment = "linux"
job = "gate-linux-arm64"
preset = "clang23-coverage"
check = "ci:coverage"

[items.build-p2996-coverage]
what = "p2996-coverage configures and builds"
environment = "linux"
job = "gate-linux-arm64"
preset = "p2996-coverage"
check = "ci"

[items.tests-p2996-coverage]
what = "p2996-coverage's ctest passes"
environment = "linux"
job = "gate-linux-arm64"
preset = "p2996-coverage"
check = "ci"

[items.coverage-p2996-coverage]
